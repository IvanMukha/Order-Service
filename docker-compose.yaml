services:

  postgres:
    image: postgres:16-alpine
    container_name: orderservice-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - innowise-network
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT}

  redis:
    image: redis:7-alpine
    container_name: orderservice-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - innowise-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderservice-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      USER_SERVICE_NAME: ${USER_SERVICE_NAME}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - innowise-network
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT}

networks:
  innowise-network:
    driver: bridge

volumes:
  postgres-data: