spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


services.user-service.url=${USER_SERVICE_URL}
services.user-service.name=${USER_SERVICE_NAME}

keycloak.server-url=${KEYCLOAK_URL}
keycloak.realm=${KEYCLOAK_REALM}

spring.security.oauth2.client.registration.keycloak-internal.authorization-grant-type=client_credentials

keycloak.token-url=${keycloak.server-url}/realms/${keycloak.realm}/protocol/openid-connect"

spring.security.oauth2.client.registration.keycloak-internal.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak-internal.client-secret=${KEYCLOAK_CLIENT_SECRET}

spring.security.oauth2.client.provider.keycloak-internal.token-uri=${keycloak.server-url}/realms/${keycloak.realm}/protocol/openid-connect/token

# ===================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.server-url}/realms/${keycloak.realm}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mukha.orderservice.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.mukha.orderservice.event.PaymentCreatedEvent

order-service.kafka.topics.payment-created=payment-events

